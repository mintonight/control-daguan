name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright (uses the runner's Google Chrome) and Pillow
        run: pip install playwright pillow
      - name: Validate data-src and rebuild public/data
        run: python3 tools/build_data.py
      - name: Build precache list
        run: python3 tools/build_precache.py
      - name: Committed public/ must match a fresh build from data-src
        run: |
          if [ -n "$(git status --porcelain -- public)" ]; then
            git status --short -- public
            echo "::error::public/ 与 data-src 重新构建的结果不一致：改题目请改 data-src/<年份>/questions.json，再运行 python3 tools/build_data.py && python3 tools/build_precache.py 并一起提交"
            exit 1
          fi
      - name: Playwright checks
        run: |
          mkdir -p shots
          python3 -m http.server 8765 -d public > /tmp/http.log 2>&1 &
          sleep 1
          for t in verify verify_fsrs verify_sync verify_notes verify_settings verify_pwa; do
            echo "::group::$t"; python3 tools/$t.py http://localhost:8765/; echo "::endgroup::"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shots
          path: shots/
          if-no-files-found: ignore
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check data files
        run: |
          python3 -c "import json;d=json.load(open('public/data/library.json'));print(len(d['questions']),'questions')"
          python3 tools/build_precache.py
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
